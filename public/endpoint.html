<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script>
        /* Stamp the theme before first paint so there is no flash. A theme
           the controller set for this timer is remembered from the last
           session, so a display that reloads mid-scenario comes back in the
           right theme rather than flashing white in a darkened room. */
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var n = q.get('timer');
                var id = (n === '1' || n === '2' || n === '3') ? 'timer-' + n : 'timer-1';
                var held = localStorage.getItem('timer.display.' + id);
                var forced = q.get('theme');
                var saved = localStorage.getItem('timer.theme');
                var t = (held === 'dark' || held === 'light') ? held
                      : (forced === 'dark' || forced === 'light') ? forced
                      : (saved === 'dark' || saved === 'light') ? saved
                      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
    <style>
        body { overflow: hidden; }

        /* ── Ambient canvas (calm mode only) ─────────────────── */
        #ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }

        body.calm #ambient { opacity: 1; }

        /* ── Header ──────────────────────────────────────────── */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 14px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .header-group { display: flex; align-items: center; gap: 10px; }

        .logo-area { width: 100px; height: 44px; opacity: 0.55; flex-shrink: 0; }
        .logo-area img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* ── Stage: the timer itself ─────────────────────────── */
        .stage {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 90px 24px 40px;
            transition: opacity 0.6s ease;
        }

        .timer-name {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-faint);
            transition: font-size 0.5s ease, color 0.5s ease;
        }

        .timer-display {
            font-size: clamp(4rem, 17vw, 13rem);
            line-height: 1.05;
            margin: 0.18em 0 0.3em;
            transition: color 1.2s ease, font-size 0.5s ease, opacity 0.6s ease;
        }

        .progress-container {
            width: min(70vw, 760px);
            height: 5px;
            border-radius: 3px;
            background: var(--accent-wash);
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            border-radius: 3px;
            background: var(--accent);
            transition: width 0.9s linear, background 1.2s ease;
        }

        .progress-bar.warning  { background: var(--warn); }
        .progress-bar.critical { background: var(--crit); }

        /* A message is the one thing on screen allowed to interrupt,
           so it stays legible — but it takes up no room when empty. */
        .message-display {
            font-size: clamp(1.1rem, 2.4vw, 2rem);
            font-weight: 300;
            letter-spacing: 0.5px;
            line-height: 1.45;
            text-align: center;
            max-width: 900px;
            margin-top: 2.2rem;
            padding: 0 20px;
        }

        .message-display:empty { display: none; }

        /* ── Calm mode ───────────────────────────────────────────
           The clock steps aside into a corner and the wave takes over
           as the way you read the session: its level is the fraction
           of time left, draining slowly down the screen. */
        body.calm .stage {
            position: fixed;
            min-height: 0;
            padding: 0;
            align-items: flex-end;
            transition: opacity 0.6s ease, inset 0.8s ease;
        }

        body.calm .timer-name { font-size: 0.62rem; letter-spacing: 3px; }

        body.calm .timer-display {
            font-size: clamp(2.2rem, 5vw, 4rem);
            letter-spacing: 2px;
            margin: 0.05em 0 0;
            opacity: 0.62;
        }

        /* As time runs out the clock quietly comes forward. */
        body.calm .timer-display.warning  { opacity: 0.8; }
        body.calm .timer-display.critical { opacity: 1; }

        /* Taken out of the layout rather than just hidden: at 70vw wide a
           zero-height bar still sets the width of the whole stage box. */
        body.calm .progress-container { display: none; }

        body.calm .message-display {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            max-width: min(80vw, 900px);
        }

        body.calm[data-corner="br"] .stage { inset: auto 5vw 6vh auto; align-items: flex-end; }
        body.calm[data-corner="bl"] .stage { inset: auto auto 6vh 5vw; align-items: flex-start; }
        body.calm[data-corner="tr"] .stage { inset: 11vh 5vw auto auto; align-items: flex-end; }
        body.calm[data-corner="tl"] .stage { inset: 11vh auto auto 5vw; align-items: flex-start; }

        /* Only meaningful in calm mode. */
        #cornerBtn { display: none; }
        body.calm #cornerBtn { display: flex; }

        /* ── Adrift ──────────────────────────────────────────────
           The clock slips its corner and drifts around the screen,
           taking a new colour off every wall it touches. */
        .stage { user-select: none; -webkit-user-select: none; }

        body.bounce .stage {
            inset: 0 auto auto 0;
            align-items: center;
            transition: none;
            will-change: transform;
        }

        body.bounce .timer-display {
            color: var(--bounce-color, var(--accent));
            opacity: 0.92;
            transition: color 0.6s ease;
        }

        body.bounce .timer-name {
            color: var(--bounce-color, var(--text-faint));
            opacity: 0.6;
            transition: color 0.6s ease;
        }

        /* A transformed ancestor would capture a fixed-position child,
           so the message rides along with the clock instead. */
        body.bounce .message-display {
            position: static;
            transform: none;
            margin-top: 0.7rem;
            max-width: min(58vw, 520px);
            font-size: 1rem;
        }

        .corner-flash {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, var(--accent-wash) 0%, transparent 62%);
        }

        .corner-flash.show { animation: cornerHit 2.8s ease-in-out; }

        .corner-flash span {
            font-size: 0.66rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        @keyframes cornerHit {
            0%   { opacity: 0; }
            18%  { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ── Blackout ────────────────────────────────────────── */
        .blackout {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .blackout.active { opacity: 1; pointer-events: auto; }

        /* ── Footer hint ─────────────────────────────────────── */
        .hint {
            position: fixed;
            bottom: 16px;
            left: 20px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .hint kbd {
            font-family: var(--font);
            font-size: 0.6rem;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            padding: 1px 5px;
        }

        @media (max-width: 768px) {
            .header { padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
            .logo-area { width: 66px; height: 34px; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="ambient"></canvas>
    <div class="blackout" id="blackout"></div>

    <div class="header chrome">
        <div class="segmented" id="timerTabs">
            <button id="tab-timer-1" class="active" onclick="selectTimer('timer-1')">Timer 1</button>
            <button id="tab-timer-2" onclick="selectTimer('timer-2')">Timer 2</button>
            <button id="tab-timer-3" onclick="selectTimer('timer-3')">Timer 3</button>
        </div>

        <div class="header-group">
            <div class="segmented" id="modeSwitch">
                <button id="mode-focus" class="active" onclick="setMode('focus')">Focus</button>
                <button id="mode-calm" onclick="setMode('calm')">Calm</button>
            </div>
            <button class="icon-btn" id="cornerBtn" onclick="cycleCorner()" title="Move the clock (P)" aria-label="Move the clock">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="13" y="13" width="6" height="6" rx="1"/></svg>
            </button>
            <button class="icon-btn" onclick="TimerApp.Fullscreen.toggle()" title="Fullscreen (F)" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
            <button class="icon-btn" data-theme-toggle onclick="TimerApp.Theme.toggle()"></button>
            <div class="logo-area"><img src="/logo.png" alt="Belmont Simulation"></div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="timer-name stale-dim" id="timerName">Timer</div>
        <div class="timer-display digits normal stale-dim" id="timerDisplay">00:00</div>
        <div class="progress-container stale-dim">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="message-display" id="messageDisplay"></div>
    </div>

    <div class="corner-flash" id="cornerFlash"><span>Corner</span></div>

    <div class="hint chrome">
        <a href="/">Home</a>
        <span><kbd>F</kbd> fullscreen</span>
        <span><kbd>C</kbd> calm</span>
        <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> timer</span>
    </div>

    <script>
        const { Theme, Fullscreen, formatClock, createStore, mountConnection,
                keepAwake, autoHideChrome, prefersReducedMotion } = TimerApp;

        const socket = io();
        const store = createStore(socket);
        mountConnection(socket);
        keepAwake();
        autoHideChrome(4000);

        const params = new URLSearchParams(location.search);

        /* ── Which timer ─────────────────────────────────────── */
        const timerParam = params.get('timer');
        let activeTimerId = ['1', '2', '3'].includes(timerParam) ? `timer-${timerParam}` : 'timer-1';

        /* Seed from the remembered controller theme, then let init() resolve
           the rest; the server's word replaces this the moment it arrives. */
        const heldKey = (id) => 'timer.display.' + id;
        Theme.setRemote(read(heldKey(activeTimerId), 'auto'));
        Theme.init();

        /* ── Mode and clock corner, remembered per browser ───── */
        const STORE_MODE = 'timer.mode';
        const STORE_CORNER = 'timer.corner';
        const CORNERS = ['br', 'bl', 'tl', 'tr'];

        function read(key, fallback) {
            try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
        }
        function write(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        let mode = params.get('mode') === 'calm' || params.get('mode') === 'focus'
            ? params.get('mode')
            : read(STORE_MODE, 'focus');
        let corner = read(STORE_CORNER, 'br');
        if (!CORNERS.includes(corner)) corner = 'br';

        function setMode(next) {
            if (next === 'focus' && bouncing) stopDrift();
            mode = next;
            write(STORE_MODE, next);
            document.body.classList.toggle('calm', next === 'calm');
            if (!bouncing) document.body.setAttribute('data-corner', corner);
            document.getElementById('mode-focus').classList.toggle('active', next === 'focus');
            document.getElementById('mode-calm').classList.toggle('active', next === 'calm');
            syncUrl();
        }

        function cycleCorner() {
            corner = CORNERS[(CORNERS.indexOf(corner) + 1) % CORNERS.length];
            write(STORE_CORNER, corner);
            if (!bouncing) document.body.setAttribute('data-corner', corner);
        }

        function syncUrl() {
            const url = new URL(location.href);
            url.searchParams.set('timer', activeTimerId.replace('timer-', ''));
            url.searchParams.set('mode', mode);
            history.replaceState({}, '', url);
        }

        function selectTimer(timerId) {
            socket.emit('leaveTimer', activeTimerId);
            activeTimerId = timerId;
            socket.emit('joinTimer', activeTimerId);
            store.ids.forEach((id) => {
                document.getElementById('tab-' + id).classList.toggle('active', id === timerId);
            });
            syncUrl();
            render();
        }

        /* ── Wiring ──────────────────────────────────────────── */
        socket.on('connect', () => socket.emit('joinTimer', activeTimerId));

        store.onUpdate((timerId) => {
            const btn = document.getElementById('tab-' + timerId);
            if (btn) btn.textContent = store.states[timerId].timerName;
            if (timerId === activeTimerId) render();
        });

        /* Discreet stand-ins for the controller's black / red / green. */
        const MESSAGE_COLORS = {
            black: 'var(--text)',
            red:   'var(--crit)',
            green: 'var(--ok)'
        };

        const el = {
            name: document.getElementById('timerName'),
            time: document.getElementById('timerDisplay'),
            bar: document.getElementById('progressBar'),
            message: document.getElementById('messageDisplay'),
            blackout: document.getElementById('blackout')
        };

        let lastClock = null;
        let lastLevel = null;

        /* Everything that only moves when the server says so. */
        function render() {
            const state = store.states[activeTimerId];
            if (!state) return;

            el.name.textContent = state.timerName;

            /* The controller can hold this display in light or dark;
               'auto' hands it back to whatever this browser prefers. */
            Theme.setRemote(state.displayTheme);
            write(heldKey(activeTimerId), state.displayTheme || 'auto');

            tick();

            if (state.message.text) {
                el.message.textContent = state.message.text;
                el.message.style.color = MESSAGE_COLORS[state.message.color] || 'var(--text)';
            } else {
                el.message.textContent = '';
            }

            el.blackout.classList.toggle('active', state.isBlackedOut);
        }

        /* Runs on every frame, so it touches the DOM only on a real change.
           The progress bar moves once a second and its own 0.9s transition
           carries it smoothly between ticks. */
        function tick() {
            const clock = formatClock(store.remainingMs(activeTimerId));
            if (clock !== lastClock) {
                lastClock = clock;
                el.time.textContent = clock;
                el.bar.style.width = (store.fractionLeft(activeTimerId) * 100) + '%';
            }

            const level = store.level(activeTimerId);
            if (level !== lastLevel) {
                lastLevel = level;
                el.time.className = 'timer-display digits stale-dim ' + level;
                el.bar.className = 'progress-bar' + (level === 'normal' ? '' : ' ' + level);
            }
        }

        /* ── Ambient wave field ──────────────────────────────────
           Three drifting sine layers filled up to a level set by the
           fraction of time remaining. The level eases toward its target
           rather than jumping, so nothing on screen ever moves sharply. */
        const canvas = document.getElementById('ambient');
        const ctx = canvas.getContext('2d');
        const reduceMotion = prefersReducedMotion();

        const LAYERS = [
            { length: 210, amp: 15, speed: 0.00013, phase: 0.0, offset: 26, alpha: 0.10 },
            { length: 155, amp: 11, speed: 0.00021, phase: 2.1, offset: 12, alpha: 0.13 },
            { length: 275, amp: 19, speed: 0.00009, phase: 4.3, offset: 0,  alpha: 0.17 }
        ];

        let cssW = 0, cssH = 0;
        let shownLevel = 1;       // eased fill level, 0..1
        let waveRgb = { r: 110, g: 125, b: 148 };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cssW = window.innerWidth;
            cssH = window.innerHeight;
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function cssVarRgb(name) {
            const hex = getComputedStyle(document.documentElement)
                .getPropertyValue(name).trim().replace('#', '');
            if (hex.length !== 6) return { r: 110, g: 125, b: 148 };
            return {
                r: parseInt(hex.slice(0, 2), 16),
                g: parseInt(hex.slice(2, 4), 16),
                b: parseInt(hex.slice(4, 6), 16)
            };
        }

        function drawWaves(ts) {
            ctx.clearRect(0, 0, cssW, cssH);

            // Waves sit at the water line; the surface falls as time drains.
            const baseY = cssH * (1 - shownLevel);

            LAYERS.forEach((layer) => {
                const t = reduceMotion ? 0 : ts;
                ctx.beginPath();
                ctx.moveTo(0, cssH);
                for (let x = 0; x <= cssW; x += 8) {
                    const y = baseY + layer.offset
                        + Math.sin(x / layer.length + t * layer.speed + layer.phase) * layer.amp
                        + Math.sin(x / (layer.length * 0.43) + t * layer.speed * 1.6) * layer.amp * 0.35;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(cssW, cssH);
                ctx.closePath();
                ctx.fillStyle = `rgba(${waveRgb.r}, ${waveRgb.g}, ${waveRgb.b}, ${layer.alpha})`;
                ctx.fill();
            });
        }

        function frame(ts) {
            requestAnimationFrame(frame);
            if (document.hidden) return;

            tick();
            if (bouncing) stepDrift(ts);

            if (mode !== 'calm') return;

            // Ease the level and the colour so both changes read as drift.
            const target = store.fractionLeft(activeTimerId);
            shownLevel += (target - shownLevel) * 0.04;

            const level = store.level(activeTimerId);
            const goal = cssVarRgb(level === 'critical' ? '--crit' : level === 'warning' ? '--warn' : '--accent');
            waveRgb.r += (goal.r - waveRgb.r) * 0.02;
            waveRgb.g += (goal.g - waveRgb.g) * 0.02;
            waveRgb.b += (goal.b - waveRgb.b) * 0.02;

            drawWaves(ts);
        }

        /* ── Easter egg: set the clock adrift ────────────────────
           Triple-click anywhere that isn't a control and the clock
           leaves its corner to wander the screen, taking a new colour
           off every wall — and making a quiet event of the rare true
           corner hit. Calm mode comes on first, since this only makes
           any sense over the waves. Triple-click again, or press
           Escape, to settle it. Deliberately not persisted: it should
           never survive into a real session by accident. */
        const stage = document.getElementById('stage');
        const cornerFlash = document.getElementById('cornerFlash');

        const DRIFT_SPEED = 78;      // px per second — a drift, not a bounce
        let bouncing = false;
        let bx = 0, by = 0, vx = 0, vy = 0;
        let hue = 210;
        let driftTs = 0;
        let cornerHits = Number(read('timer.corners', '0')) || 0;

        function paintDrift() {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            stage.style.setProperty('--bounce-color', `hsl(${Math.round(hue)}, 24%, ${dark ? 68 : 50}%)`);
        }

        function startDrift() {
            // Note where it is sitting before the layout changes under us.
            const box = mode === 'calm' ? stage.getBoundingClientRect() : null;
            if (mode !== 'calm') setMode('calm');

            bouncing = true;
            document.body.classList.add('bounce');
            document.body.removeAttribute('data-corner');

            const maxX = Math.max(0, window.innerWidth - stage.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - stage.offsetHeight);
            bx = box ? Math.min(Math.max(box.left, 0), maxX) : maxX / 2;
            by = box ? Math.min(Math.max(box.top, 0), maxY) : maxY / 2;

            // Keep it off the axes, or it just slides along one edge.
            const angle = (0.35 + Math.random() * 0.3) * Math.PI / 2;
            vx = Math.cos(angle) * DRIFT_SPEED * (Math.random() < 0.5 ? -1 : 1);
            vy = Math.sin(angle) * DRIFT_SPEED * (Math.random() < 0.5 ? -1 : 1);

            driftTs = 0;
            paintDrift();
        }

        function stopDrift() {
            bouncing = false;
            document.body.classList.remove('bounce');
            document.body.setAttribute('data-corner', corner);
            stage.style.transform = '';
            stage.style.removeProperty('--bounce-color');
        }

        function markCorner() {
            cornerHits++;
            write('timer.corners', String(cornerHits));
            cornerFlash.querySelector('span').textContent =
                cornerHits === 1 ? 'Corner' : 'Corner · ' + cornerHits;
            cornerFlash.classList.remove('show');
            void cornerFlash.offsetWidth;      // force reflow to restart the fade
            cornerFlash.classList.add('show');
        }

        function stepDrift(ts) {
            // Clamp dt so a backgrounded tab does not teleport the clock.
            const dt = driftTs ? Math.min((ts - driftTs) / 1000, 0.05) : 0;
            driftTs = ts;

            const maxX = Math.max(0, window.innerWidth - stage.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - stage.offsetHeight);

            bx += vx * dt;
            by += vy * dt;

            let hitX = false, hitY = false;
            if (bx <= 0)         { bx = 0;    vx = Math.abs(vx);  hitX = true; }
            else if (bx >= maxX) { bx = maxX; vx = -Math.abs(vx); hitX = true; }
            if (by <= 0)         { by = 0;    vy = Math.abs(vy);  hitY = true; }
            else if (by >= maxY) { by = maxY; vy = -Math.abs(vy); hitY = true; }

            // Both walls on the same frame is the one everyone waits for.
            if (hitX && hitY) markCorner();
            if (hitX || hitY) {
                hue = (hue + 47 + Math.random() * 26) % 360;
                paintDrift();
            }

            stage.style.transform = `translate3d(${bx}px, ${by}px, 0)`;
        }

        /* Pressing D on a display the controller is holding should say so
           rather than do nothing. Reuses the corner flash. */
        function flashLocked() {
            cornerFlash.querySelector('span').textContent = 'Theme set by controller';
            cornerFlash.classList.remove('show');
            void cornerFlash.offsetWidth;
            cornerFlash.classList.add('show');   // the animation fades itself out
        }

        /* detail === 3 is the browser's own triple-click counter. */
        document.addEventListener('click', (e) => {
            if (e.detail !== 3) return;
            if (e.target.closest('button, a, input, .header, .hint')) return;
            bouncing ? stopDrift() : startDrift();
        });

        /* ── Keyboard ────────────────────────────────────────── */
        window.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            const key = e.key.toLowerCase();
            if (key === 'f') Fullscreen.toggle();
            else if (key === 'c') setMode(mode === 'calm' ? 'focus' : 'calm');
            else if (key === 'd') { if (!Theme.toggle()) flashLocked(); }
            else if (key === 'p') cycleCorner();
            else if (key === 'escape' && bouncing) stopDrift();
            else if (['1', '2', '3'].includes(key)) selectTimer('timer-' + key);
        });

        window.addEventListener('resize', resize);

        /* ── Go ──────────────────────────────────────────────── */
        resize();
        setMode(mode);
        shownLevel = store.fractionLeft(activeTimerId);
        requestAnimationFrame(frame);
    </script>
</body>
</html>

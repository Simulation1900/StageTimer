<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script>
        (function () {
            try {
                var forced = new URLSearchParams(location.search).get('theme');
                var saved = localStorage.getItem('timer.theme');
                var t = (forced === 'dark' || forced === 'light') ? forced
                      : (saved === 'dark' || saved === 'light') ? saved
                      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
    <style>
        body { padding: 22px; }

        .page-wrapper { max-width: 1600px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 16px 22px;
            margin-bottom: 18px;
        }

        .header-group { display: flex; align-items: center; gap: 10px; }
        .logo-area { width: 92px; height: 42px; opacity: 0.55; }
        .logo-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .back-link { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 900px) {
            body { padding: 12px; }
            .timer-grid { grid-template-columns: 1fr; }
        }

        /* ── Card ────────────────────────────────────────────── */
        .timer-card {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-top: 2px solid var(--border);
            transition: border-color 0.6s ease;
        }

        .timer-card.running  { border-top-color: var(--ok); }
        .timer-card.warning  { border-top-color: var(--warn); }
        .timer-card.critical { border-top-color: var(--crit); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }

        .card-timer-name {
            font-size: 0.74rem;
            font-weight: 400;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .status-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border-strong);
            transition: background 0.3s ease;
        }

        .status-badge.running::before { background: var(--ok); }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 26px 20px 22px;
        }

        .card-time {
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            transition: color 1.2s ease;
        }

        .card-progress-container {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: var(--accent-wash);
            overflow: hidden;
        }

        .card-progress-bar {
            height: 100%;
            border-radius: 3px;
            background: var(--accent);
            transition: width 0.9s linear, background 1.2s ease;
        }

        .card-progress-bar.warning  { background: var(--warn); }
        .card-progress-bar.critical { background: var(--crit); }

        .card-message {
            width: 100%;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.4;
            word-break: break-word;
        }

        .card-message:empty { display: none; }

        /* ── Blackout ────────────────────────────────────────── */
        .card-blackout {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: var(--radius);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .card-blackout.active { opacity: 1; pointer-events: auto; }

        .card-blackout-label {
            font-size: 0.66rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header panel">
            <div>
                <h1>Director View</h1>
                <a href="/" class="back-link">Home</a>
            </div>
            <div class="header-group">
                <button class="icon-btn" data-theme-toggle onclick="TimerApp.Theme.toggle()"></button>
                <div class="logo-area"><img src="/logo.png" alt="Belmont Simulation"></div>
            </div>
        </div>

        <div class="timer-grid" id="timerGrid"></div>
    </div>

    <template id="cardTemplate">
        <div class="timer-card panel">
            <div class="card-blackout"><span class="card-blackout-label">Blacked Out</span></div>
            <div class="card-header">
                <span class="card-timer-name"></span>
                <span class="status-badge">Stopped</span>
            </div>
            <div class="card-body stale-dim">
                <div class="card-time digits normal">00:00</div>
                <div class="card-progress-container">
                    <div class="card-progress-bar" style="width: 100%;"></div>
                </div>
                <div class="card-message"></div>
            </div>
        </div>
    </template>

    <script>
        const { Theme, formatClock, createStore, mountConnection } = TimerApp;

        Theme.init();

        const socket = io();
        const store = createStore(socket);
        mountConnection(socket);

        socket.on('connect', () => socket.emit('joinAll'));

        const MESSAGE_COLORS = { black: 'var(--text)', red: 'var(--crit)', green: 'var(--ok)' };

        /* Build the three cards from one template rather than three
           near-identical copies of the same markup. */
        const grid = document.getElementById('timerGrid');
        const template = document.getElementById('cardTemplate');
        const cards = {};

        store.ids.forEach((timerId) => {
            const node = template.content.firstElementChild.cloneNode(true);
            grid.appendChild(node);
            cards[timerId] = {
                card: node,
                name: node.querySelector('.card-timer-name'),
                badge: node.querySelector('.status-badge'),
                time: node.querySelector('.card-time'),
                bar: node.querySelector('.card-progress-bar'),
                message: node.querySelector('.card-message'),
                blackout: node.querySelector('.card-blackout')
            };
        });

        function renderCard(timerId) {
            const state = store.states[timerId];
            const ui = cards[timerId];
            if (!state || !ui) return;

            ui.name.textContent = state.timerName;
            ui.badge.textContent = state.isRunning ? 'Running' : 'Stopped';
            ui.badge.className = 'status-badge' + (state.isRunning ? ' running' : '');

            const level = store.level(timerId);
            ui.time.textContent = formatClock(store.remainingMs(timerId));
            ui.time.className = 'card-time digits ' + level;

            ui.bar.style.width = (store.fractionLeft(timerId) * 100) + '%';
            ui.bar.className = 'card-progress-bar' + (level === 'normal' ? '' : ' ' + level);

            ui.card.className = 'timer-card panel';
            if (state.isRunning) ui.card.classList.add(level === 'normal' ? 'running' : level);

            if (state.message.text) {
                ui.message.textContent = state.message.text;
                ui.message.style.color = MESSAGE_COLORS[state.message.color] || 'var(--text)';
            } else {
                ui.message.textContent = '';
            }

            ui.blackout.classList.toggle('active', state.isBlackedOut);
        }

        store.onUpdate(renderCard);

        // Countdowns are derived locally, so tick every card ourselves.
        setInterval(() => store.ids.forEach(renderCard), 250);
        store.ids.forEach(renderCard);
    </script>
</body>
</html>

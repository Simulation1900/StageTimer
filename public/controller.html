<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script>
        (function () {
            try {
                var forced = new URLSearchParams(location.search).get('theme');
                var saved = localStorage.getItem('timer.theme');
                var t = (forced === 'dark' || forced === 'light') ? forced
                      : (saved === 'dark' || saved === 'light') ? saved
                      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
    <style>
        body { padding: 22px; }

        /* Each timer keeps a hue of its own so you always know which one
           you are holding — muted to stay inside the same quiet palette. */
        [data-timer="timer-2"] {
            --accent: #9a7480; --accent-strong: #7d5b66; --accent-wash: rgba(154, 116, 128, 0.10);
        }
        [data-timer="timer-3"] {
            --accent: #6f8f88; --accent-strong: #54726c; --accent-wash: rgba(111, 143, 136, 0.10);
        }
        :root[data-theme="dark"] [data-timer="timer-2"] {
            --accent: #bd949e; --accent-strong: #d4b0b8; --accent-wash: rgba(189, 148, 158, 0.10);
        }
        :root[data-theme="dark"] [data-timer="timer-3"] {
            --accent: #8fb0a8; --accent-strong: #a9c8c1; --accent-wash: rgba(143, 176, 168, 0.10);
        }

        /* ── Auth ────────────────────────────────────────────── */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 44px);
        }

        .auth-container {
            width: 100%;
            max-width: 360px;
            padding: 36px;
            text-align: center;
        }

        .auth-container h2 { margin-bottom: 26px; }
        .auth-container .btn { width: 100%; margin-top: 16px; }

        /* ── Layout ──────────────────────────────────────────── */
        .controller-screen { display: none; max-width: 1360px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 16px 22px;
            margin-bottom: 14px;
        }

        .header-group { display: flex; align-items: center; gap: 10px; }
        .logo-area { width: 92px; height: 42px; opacity: 0.55; }
        .logo-area img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .tab-bar { display: flex; gap: 6px; padding: 7px; margin-bottom: 18px; }

        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 11px 8px;
            font-family: var(--font);
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            border-radius: 9px;
            color: var(--text-faint);
            cursor: pointer;
            transition: color 0.25s ease, background 0.25s ease;
        }

        .tab-btn:hover { color: var(--text-dim); }
        .tab-btn.active { background: var(--accent-wash); color: var(--text); }

        #tab-timer-1.active { border-bottom-color: #6e7d94; }
        #tab-timer-2.active { border-bottom-color: #9a7480; }
        #tab-timer-3.active { border-bottom-color: #6f8f88; }

        .tab-label {
            font-size: 0.64rem;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text-faint);
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border-strong);
            margin-left: 6px;
            vertical-align: middle;
            transition: background 0.3s ease;
        }

        .tab-dot.running { background: var(--ok); }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .control-panel { padding: 24px; }

        .control-panel h3 {
            margin-bottom: 20px;
            padding-bottom: 11px;
            border-bottom: 1px solid var(--border);
            color: var(--accent-strong);
        }

        .form-group { margin-bottom: 14px; }
        .form-group .btn { width: 100%; }

        /* ── Duration inputs ─────────────────────────────────── */
        .duration-row { display: flex; gap: 10px; }
        .duration-row .form-group { flex: 1; margin-bottom: 0; }

        .duration-row input {
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 1.1rem;
        }

        .preset-row { display: flex; gap: 6px; margin: 12px 0 14px; }
        .preset-row .btn { flex: 1; padding: 8px 0; letter-spacing: 1px; }

        /* ── Transport ───────────────────────────────────────── */
        .transport { display: flex; gap: 8px; }
        .transport .btn { flex: 1; }

        /* Nudging the clock mid-run, without stopping it. */
        .adjust-block { margin-top: 18px; }

        .adjust-row { display: flex; gap: 5px; }
        .adjust-row .btn {
            flex: 1;
            padding: 9px 0;
            font-size: 0.66rem;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        /* ── Status ──────────────────────────────────────────── */
        .status-display {
            margin-top: 18px;
            padding: 14px 16px;
            background: var(--accent-wash);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }

        .status-item:last-child { border-bottom: none; }

        .status-label {
            font-size: 0.66rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .status-value {
            font-variant-numeric: tabular-nums;
            font-weight: 300;
            color: var(--text);
        }

        #timeRemaining { font-size: 1.6rem; font-weight: 200; letter-spacing: 2px; }
        #timeRemaining.warning  { color: var(--warn); }
        #timeRemaining.critical { color: var(--crit); }

        /* Light or dark for every display on this timer. */
        .theme-control { margin-top: 18px; }
        .theme-control .segmented { display: flex; width: 100%; }
        .theme-control .segmented button { flex: 1; }

        .control-note {
            margin-top: 8px;
            font-size: 0.66rem;
            letter-spacing: 0.5px;
            color: var(--text-faint);
        }

        .toggle-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
        }

        .toggle-control label { margin-bottom: 0; }

        .toggle-switch { position: relative; width: 46px; height: 25px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            border-radius: 25px;
            background: var(--border-strong);
            transition: background 0.3s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 19px; height: 19px;
            left: 3px; bottom: 3px;
            border-radius: 50%;
            background: var(--surface-solid);
            transition: transform 0.3s ease;
        }

        input:checked + .slider { background: var(--accent); }
        input:checked + .slider::before { transform: translateX(21px); }

        /* ── Messages ────────────────────────────────────────── */
        textarea { resize: vertical; min-height: 78px; }

        .color-buttons { display: flex; gap: 6px; margin-top: 10px; }
        .color-buttons .btn { flex: 1; padding: 9px 0; }

        .message-preview {
            margin-top: 14px;
            padding: 15px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 300;
            border: 1px solid var(--border);
            border-radius: 10px;
            word-break: break-word;
        }

        .error-message {
            margin-top: 12px;
            font-size: 0.78rem;
            color: var(--crit);
        }

        .back-link { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="auth-screen" id="authScreen">
        <div class="auth-container panel">
            <h2>Controller Access</h2>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Controller password">
            </div>
            <button class="btn btn-primary" onclick="authenticate()">Enter</button>
            <div id="authError" class="error-message" style="display: none;"></div>
            <p style="margin-top: 22px;"><a href="/" class="back-link">Home</a></p>
        </div>
    </div>

    <div class="controller-screen" id="controllerScreen" data-timer="timer-1">
        <div class="header panel">
            <div>
                <h1>Timer Controller</h1>
                <a href="/" class="back-link">Home</a>
            </div>
            <div class="header-group">
                <button class="icon-btn" data-theme-toggle onclick="TimerApp.Theme.toggle()"></button>
                <div class="logo-area"><img src="/logo.png" alt="Belmont Simulation"></div>
            </div>
        </div>

        <div class="tab-bar panel">
            <button class="tab-btn active" id="tab-timer-1" onclick="switchTab('timer-1')">
                <span>Timer 1<span class="tab-dot" id="dot-timer-1"></span></span>
                <span class="tab-label" id="tablabel-timer-1">Timer 1</span>
            </button>
            <button class="tab-btn" id="tab-timer-2" onclick="switchTab('timer-2')">
                <span>Timer 2<span class="tab-dot" id="dot-timer-2"></span></span>
                <span class="tab-label" id="tablabel-timer-2">Timer 2</span>
            </button>
            <button class="tab-btn" id="tab-timer-3" onclick="switchTab('timer-3')">
                <span>Timer 3<span class="tab-dot" id="dot-timer-3"></span></span>
                <span class="tab-label" id="tablabel-timer-3">Timer 3</span>
            </button>
        </div>

        <div class="control-grid">
            <div class="control-panel panel">
                <h3>Timer Settings</h3>
                <div class="form-group">
                    <label for="timerName">Timer Name</label>
                    <input type="text" id="timerName" placeholder="Enter timer name">
                </div>
                <div class="form-group">
                    <button class="btn" onclick="updateTimerName()">Update Name</button>
                </div>

                <div class="duration-row" style="margin-top: 22px;">
                    <div class="form-group">
                        <label for="hours">Hrs</label>
                        <input type="number" id="hours" min="0" max="23" value="0">
                    </div>
                    <div class="form-group">
                        <label for="minutes">Min</label>
                        <input type="number" id="minutes" min="0" max="59" value="10">
                    </div>
                    <div class="form-group">
                        <label for="seconds">Sec</label>
                        <input type="number" id="seconds" min="0" max="59" value="0">
                    </div>
                </div>

                <div class="preset-row">
                    <button class="btn" onclick="preset(5)">5m</button>
                    <button class="btn" onclick="preset(10)">10m</button>
                    <button class="btn" onclick="preset(20)">20m</button>
                    <button class="btn" onclick="preset(45)">45m</button>
                    <button class="btn" onclick="preset(60)">60m</button>
                </div>

                <button class="btn btn-primary" style="width: 100%;" onclick="setTimer()">Set Timer</button>
            </div>

            <div class="control-panel panel">
                <h3>Timer Controls</h3>
                <div class="transport">
                    <button class="btn btn-ok" onclick="startTimer()">Start</button>
                    <button class="btn btn-warn" onclick="pauseTimer()">Pause</button>
                    <button class="btn btn-crit" onclick="resetTimer()">Reset</button>
                </div>

                <div class="adjust-block">
                    <label>Adjust while running</label>
                    <div class="adjust-row">
                        <button class="btn" onclick="adjust(-300)">−5m</button>
                        <button class="btn" onclick="adjust(-60)">−1m</button>
                        <button class="btn" onclick="adjust(-30)">−30s</button>
                        <button class="btn" onclick="adjust(30)">+30s</button>
                        <button class="btn" onclick="adjust(60)">+1m</button>
                        <button class="btn" onclick="adjust(300)">+5m</button>
                    </div>
                </div>

                <div class="theme-control">
                    <label>Display Theme</label>
                    <div class="segmented" id="displayTheme">
                        <button id="dtheme-auto" class="active" onclick="setDisplayTheme('auto')">Auto</button>
                        <button id="dtheme-light" onclick="setDisplayTheme('light')">Light</button>
                        <button id="dtheme-dark" onclick="setDisplayTheme('dark')">Dark</button>
                    </div>
                    <div class="control-note" id="displayThemeNote">Each display follows its own preference.</div>
                </div>

                <div class="toggle-control">
                    <label for="blackoutToggle">Blackout Screen</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="blackoutToggle" onchange="toggleBlackout()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="status-display">
                    <div class="status-item">
                        <span class="status-label">Status</span>
                        <span class="status-value" id="timerStatus">Stopped</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Remaining</span>
                        <span class="status-value digits" id="timeRemaining">00:00</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Total</span>
                        <span class="status-value" id="totalTime">00:00</span>
                    </div>
                </div>
            </div>

            <div class="control-panel panel">
                <h3>Message Display</h3>
                <div class="form-group">
                    <label for="messageText">Message Text</label>
                    <textarea id="messageText" rows="3" placeholder="Enter message to display"></textarea>
                </div>
                <div class="color-buttons">
                    <button class="btn" onclick="sendMessage('black')">Neutral</button>
                    <button class="btn btn-crit" onclick="sendMessage('red')">Urgent</button>
                    <button class="btn btn-ok" onclick="sendMessage('green')">Positive</button>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <button class="btn" onclick="clearMessage()">Clear Message</button>
                </div>

                <div class="message-preview" id="messagePreview">No message</div>
            </div>
        </div>
    </div>

    <script>
        const { Theme, formatClock, createStore, mountConnection } = TimerApp;

        Theme.init();

        const socket = io();
        const store = createStore(socket);
        mountConnection(socket);

        let isAuthenticated = false;
        let activeTimerId = 'timer-1';

        /* ── Auth ────────────────────────────────────────────── */
        function authenticate() {
            socket.emit('authenticate', document.getElementById('password').value);
        }

        socket.on('authResult', (ok) => {
            if (ok) {
                isAuthenticated = true;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('controllerScreen').style.display = 'block';
                socket.emit('joinAll');
                renderActiveTab();
            } else {
                const err = document.getElementById('authError');
                err.textContent = 'Invalid password. Please try again.';
                err.style.display = 'block';
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') authenticate();
        });

        socket.on('connect', () => { if (isAuthenticated) socket.emit('joinAll'); });

        /* ── Wiring ──────────────────────────────────────────── */
        store.onUpdate((timerId) => {
            updateTabIndicator(timerId);
            if (timerId === activeTimerId && isAuthenticated) renderActiveTab();
        });

        function switchTab(timerId) {
            activeTimerId = timerId;
            store.ids.forEach((id) => {
                document.getElementById('tab-' + id).classList.toggle('active', id === timerId);
            });
            document.getElementById('controllerScreen').setAttribute('data-timer', timerId);
            renderActiveTab();
        }

        const MESSAGE_COLORS = { black: 'var(--text)', red: 'var(--crit)', green: 'var(--ok)' };

        function renderActiveTab() {
            const state = store.states[activeTimerId];
            if (!state) return;

            document.getElementById('timerStatus').textContent = state.isRunning ? 'Running' : 'Stopped';
            document.getElementById('totalTime').textContent = formatClock(state.totalSeconds * 1000);

            const remaining = document.getElementById('timeRemaining');
            remaining.textContent = formatClock(store.remainingMs(activeTimerId));
            remaining.className = 'status-value digits ' + store.level(activeTimerId);

            document.getElementById('blackoutToggle').checked = state.isBlackedOut;
            renderDisplayTheme(state.displayTheme || 'auto');

            const nameField = document.getElementById('timerName');
            if (document.activeElement !== nameField) nameField.value = state.timerName;

            const preview = document.getElementById('messagePreview');
            if (state.message.text) {
                preview.textContent = state.message.text;
                preview.style.color = MESSAGE_COLORS[state.message.color] || 'var(--text)';
            } else {
                preview.textContent = 'No message';
                preview.style.color = 'var(--text-faint)';
            }
        }

        const DISPLAY_THEMES = ['auto', 'light', 'dark'];

        const THEME_NOTES = {
            auto:  'Each display follows its own preference.',
            light: 'Every display on this timer is held in light.',
            dark:  'Every display on this timer is held in dark.'
        };

        function renderDisplayTheme(theme) {
            DISPLAY_THEMES.forEach((t) => {
                document.getElementById('dtheme-' + t).classList.toggle('active', t === theme);
            });
            document.getElementById('displayThemeNote').textContent = THEME_NOTES[theme];
        }

        function updateTabIndicator(timerId) {
            const state = store.states[timerId];
            const dot = document.getElementById('dot-' + timerId);
            const label = document.getElementById('tablabel-' + timerId);
            if (dot) dot.className = 'tab-dot' + (state.isRunning ? ' running' : '');
            if (label) label.textContent = state.timerName;
        }

        /* The remaining figure is derived locally, so tick it ourselves
           rather than waiting on the server for every second. */
        setInterval(() => { if (isAuthenticated) renderActiveTab(); }, 250);

        /* ── Commands ────────────────────────────────────────── */
        function preset(minutes) {
            document.getElementById('hours').value = Math.floor(minutes / 60);
            document.getElementById('minutes').value = minutes % 60;
            document.getElementById('seconds').value = 0;
        }

        function setTimer() {
            const h = parseInt(document.getElementById('hours').value, 10) || 0;
            const m = parseInt(document.getElementById('minutes').value, 10) || 0;
            const s = parseInt(document.getElementById('seconds').value, 10) || 0;
            socket.emit('setTimer', { timerId: activeTimerId, seconds: h * 3600 + m * 60 + s });
        }

        function startTimer() { socket.emit('startTimer', { timerId: activeTimerId }); }
        function pauseTimer() { socket.emit('pauseTimer', { timerId: activeTimerId }); }
        function resetTimer() { socket.emit('resetTimer', { timerId: activeTimerId }); }
        function adjust(deltaSeconds) { socket.emit('adjustTimer', { timerId: activeTimerId, deltaSeconds }); }

        function updateTimerName() {
            socket.emit('updateTimerName', { timerId: activeTimerId, name: document.getElementById('timerName').value });
        }

        function sendMessage(color) {
            const text = document.getElementById('messageText').value;
            if (text.trim()) socket.emit('sendMessage', { timerId: activeTimerId, text, color });
        }

        function clearMessage() {
            document.getElementById('messageText').value = '';
            socket.emit('clearMessage', { timerId: activeTimerId });
        }

        /* Applies to every endpoint watching the active timer, not to
           this controller — the operator keeps their own theme. */
        function setDisplayTheme(theme) {
            socket.emit('setDisplayTheme', { timerId: activeTimerId, theme });
        }

        function toggleBlackout() {
            socket.emit('toggleBlackout', {
                timerId: activeTimerId,
                isBlackedOut: document.getElementById('blackoutToggle').checked
            });
        }

        /* ── Keyboard: space starts or pauses the active timer ── */
        window.addEventListener('keydown', (e) => {
            if (!isAuthenticated) return;
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea') return;
            if (e.code === 'Space') {
                e.preventDefault();
                store.states[activeTimerId].isRunning ? pauseTimer() : startTimer();
            }
        });
    </script>
</body>
</html>

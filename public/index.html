<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script>
        (function () {
            try {
                var forced = new URLSearchParams(location.search).get('theme');
                var saved = localStorage.getItem('timer.theme');
                var t = (forced === 'dark' || forced === 'light') ? forced
                      : (saved === 'dark' || saved === 'light') ? saved
                      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script src="/app.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .theme-corner { position: fixed; top: 20px; right: 20px; }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 46px 40px 36px;
            text-align: center;
        }

        h1 {
            font-size: 1.05rem;
            letter-spacing: 5px;
            color: var(--text);
        }

        .tagline {
            margin-top: 12px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 34px 0 26px;
        }

        .button-container .btn { width: 100%; padding: 15px; }

        .director-link {
            font-size: 0.66rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .director-link:hover { color: var(--accent); }

        .logo-placeholder { margin-top: 32px; opacity: 0.5; }
        .logo-placeholder img { max-width: 160px; max-height: 62px; object-fit: contain; }
    </style>
</head>
<body>
    <button class="icon-btn theme-corner" data-theme-toggle onclick="TimerApp.Theme.toggle()"></button>

    <div class="container panel">
        <h1>Simulation Timer</h1>
        <p class="tagline">Select your role to continue</p>

        <div class="button-container">
            <a href="/controller" class="btn btn-primary">Controller</a>
            <a href="/endpoint" class="btn">Endpoint Display</a>
        </div>

        <a href="/director" class="director-link">Director View</a>

        <div class="logo-placeholder">
            <img src="/logo.png" alt="Belmont Simulation">
        </div>
    </div>

    <script>TimerApp.Theme.init();</script>
</body>
</html>
